<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viraj Shah | AI Engineer</title>
    <meta
      name="description"
      content="AI Engineer focused on production-grade ML systems, LLM orchestration, and applied research."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <main class="grid">
        <section class="panel hero" aria-label="Profile overview">
          <div class="panel__header">TITLE_ID: 001_HERO</div>
          <h1 class="hero__name" data-field="hero-name"></h1>
          <div class="hero__meta">
            <div class="hero__status" data-field="hero-status"></div>
            <p class="hero__badge" data-field="hero-badge"></p>
          </div>
          <p class="hero__role" data-field="hero-role"></p>
          <p class="hero__bio" data-field="hero-bio"></p>
          <div class="hero__actions" data-field="hero-actions"></div>
        </section>

        <section class="panel experience" aria-label="Experience log">
          <div class="panel__header">[02]::EXPERIENCE_LOGS</div>
          <div class="experience__list" data-field="experience-list"></div>
        </section>

        <section class="panel skills" aria-label="Technical skills">
          <div class="panel__header">TECHNICAL_SKILLS</div>
          <div class="skills__list" data-field="skills-list"></div>
        </section>

        <section class="panel activity" aria-label="GitHub activity">
          <div class="panel__header">GITHUB_ACTIVITY</div>
          <div class="activity__chart" data-activity-chart>
            <span style="--bar: 22%" aria-label="Mon"></span>
            <span style="--bar: 38%" aria-label="Tue"></span>
            <span style="--bar: 46%" aria-label="Wed"></span>
            <span style="--bar: 62%" aria-label="Thu"></span>
            <span style="--bar: 58%" aria-label="Fri"></span>
            <span style="--bar: 40%" aria-label="Sat"></span>
            <span style="--bar: 52%" aria-label="Sun"></span>
          </div>
          <p class="activity__note">Live from GitHub public events (last 7 days).</p>
        </section>

        <section class="panel education" aria-label="Education">
          <div class="panel__header">EDUCATION</div>
          <div class="education__list" data-field="education-list"></div>
        </section>

      </main>

      <footer class="footer">
        <div class="footer__links" data-field="footer-links"></div>
        <div class="footer__meta" data-field="footer-meta"></div>
      </footer>
    </div>
    <script src="scripts.js"></script>
  </body>
</html>
